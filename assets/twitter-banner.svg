<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00e676" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#00e676" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#00e676" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
    <!-- Area under curve A (start at 20) -->
    <linearGradient id="areaA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00e676" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
    <!-- Area under curve B (start at 30) -->
    <linearGradient id="areaB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00e676" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#rightGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1500" height="2" fill="url(#greenLine)"/>

  <!-- Subtle grid -->
  <g opacity="0.022" stroke="#00e676" stroke-width="0.5">
    <line x1="0"    y1="125" x2="1500" y2="125"/>
    <line x1="0"    y1="250" x2="1500" y2="250"/>
    <line x1="0"    y1="375" x2="1500" y2="375"/>
    <line x1="300"  y1="0"   x2="300"  y2="500"/>
    <line x1="600"  y1="0"   x2="600"  y2="500"/>
    <line x1="900"  y1="0"   x2="900"  y2="500"/>
    <line x1="1200" y1="0"   x2="1200" y2="500"/>
  </g>

  <!-- Vertical separator before chart -->
  <line x1="835" y1="55" x2="835" y2="465" stroke="#00e676" stroke-width="0.5" opacity="0.1"/>

  <!-- ===== CHART: two curves showing 20 vs 30 start ===== -->

  <!-- CURVE B fill (start at 30 — dimmer) -->
  <polygon
    points="990,440 1050,433 1115,420 1185,398 1255,366 1325,322 1395,265 1450,220 1450,455 990,455"
    fill="url(#areaB)"/>

  <!-- CURVE A fill (start at 20 — bright) -->
  <polygon
    points="860,440 920,433 990,420 1060,400 1135,372 1210,332 1285,278 1360,208 1420,152 1450,122 1450,455 860,455"
    fill="url(#areaA)"/>

  <!-- CURVE B line (start at 30 — dashed, dim) -->
  <polyline
    points="990,440 1050,433 1115,420 1185,398 1255,366 1325,322 1395,265 1450,220"
    fill="none" stroke="#00e676" stroke-width="2.5" stroke-dasharray="8,5"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- CURVE A line (start at 20 — solid, bright) -->
  <polyline
    points="860,440 920,433 990,420 1060,400 1135,372 1210,332 1285,278 1360,208 1420,152 1450,122"
    fill="none" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Endpoint A -->
  <circle cx="1450" cy="122" r="10" fill="#00e676" opacity="0.2"/>
  <circle cx="1450" cy="122" r="6"  fill="#00e676"/>
  <text x="1450" y="105" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="900" fill="#00e676" text-anchor="middle">$736K</text>

  <!-- Endpoint B -->
  <circle cx="1450" cy="220" r="7" fill="#00e676" opacity="0.4"/>
  <circle cx="1450" cy="220" r="3.5" fill="#00e676" opacity="0.6"/>
  <text x="1450" y="240" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" fill="#00e676" text-anchor="middle" opacity="0.5">$380K</text>

  <!-- GAP bracket -->
  <line x1="1468" y1="122" x2="1468" y2="220" stroke="#00e676" stroke-width="1.5" opacity="0.35"/>
  <line x1="1462" y1="122" x2="1475" y2="122" stroke="#00e676" stroke-width="1.5" opacity="0.35"/>
  <line x1="1462" y1="220" x2="1475" y2="220" stroke="#00e676" stroke-width="1.5" opacity="0.35"/>
  <text x="1480" y="177" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#00e676" opacity="0.5" dominant-baseline="middle">−$356K</text>

  <!-- Curve start labels -->
  <text x="858"  y="460" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#00e676" opacity="0.65" text-anchor="middle">Age 20</text>
  <text x="990"  y="460" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#00e676" opacity="0.35" text-anchor="middle">Age 30</text>
  <text x="1450" y="475" font-family="Inter,system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.18)" text-anchor="middle">Age 65</text>

  <!-- ===== LEFT TEXT (shifted right — safe from profile pic) ===== -->

  <!-- Brand tag -->
  <text x="230" y="95" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#00e676" opacity="0.7">YOUNG INVESTOR</text>
  <rect x="230" y="103" width="178" height="1.5" fill="#00e676" opacity="0.22"/>

  <!-- Main headline -->
  <text x="230" y="196" font-family="Inter,system-ui,sans-serif" font-size="74" font-weight="900" fill="#ffffff" letter-spacing="-3">Invest at 20.</text>
  <text x="230" y="282" font-family="Inter,system-ui,sans-serif" font-size="74" font-weight="900" fill="rgba(255,255,255,0.35)" letter-spacing="-3">Not 30.</text>
  <text x="230" y="368" font-family="Inter,system-ui,sans-serif" font-size="74" font-weight="900" fill="#00e676" letter-spacing="-3">See the gap.</text>

  <!-- Tagline -->
  <text x="232" y="418" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.35)" letter-spacing="0.3">Free simulator. No excuses. younginvestor.app</text>

</svg>
