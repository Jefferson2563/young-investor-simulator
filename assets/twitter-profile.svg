<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Head gradient: bright on face/front, dark on back -->
    <radialGradient id="headGrad" cx="62%" cy="38%" r="58%">
      <stop offset="0%"   stop-color="#c8c8c8"/>
      <stop offset="35%"  stop-color="#909090"/>
      <stop offset="70%"  stop-color="#505050"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <!-- Clip path = head shape -->
    <clipPath id="headClip">
      <path d="M 148,400 C 145,368 140,338 137,308 C 130,268 112,238 106,200 C 100,164 105,136 118,110 C 131,85 150,64 178,50 C 200,38 226,35 252,46 C 274,57 287,78 288,103 C 293,118 290,135 284,150 C 293,163 300,178 296,193 C 302,207 304,222 297,234 C 290,246 282,253 278,263 C 270,278 255,288 238,294 C 224,300 222,322 225,362 L 225,400 Z"/>
    </clipPath>
    <!-- Area under chart -->
    <linearGradient id="chartArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00e676" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="400" height="400" fill="#000"/>

  <!-- Head silhouette -->
  <path d="M 148,400 C 145,368 140,338 137,308 C 130,268 112,238 106,200 C 100,164 105,136 118,110 C 131,85 150,64 178,50 C 200,38 226,35 252,46 C 274,57 287,78 288,103 C 293,118 290,135 284,150 C 293,163 300,178 296,193 C 302,207 304,222 297,234 C 290,246 282,253 278,263 C 270,278 255,288 238,294 C 224,300 222,322 225,362 L 225,400 Z" fill="url(#headGrad)"/>

  <!-- Interior: dark overlay + compound growth chart clipped to head -->
  <g clip-path="url(#headClip)">
    <rect width="400" height="400" fill="rgba(0,0,0,0.52)"/>

    <!-- Area fill under curve -->
    <polygon points="120,235 140,228 162,220 185,208 208,192 230,170 250,143 266,112 278,85 278,248 120,248" fill="url(#chartArea)"/>

    <!-- Growth curve: age 20 to 65 -->
    <polyline points="120,235 140,228 162,220 185,208 208,192 230,170 250,143 266,112 278,85"
      fill="none" stroke="#00e676" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Glowing top dot -->
    <circle cx="278" cy="85" r="12" fill="#00e676" opacity="0.12"/>
    <circle cx="278" cy="85" r="6"  fill="#00e676" opacity="0.7"/>
    <circle cx="278" cy="85" r="3"  fill="#00e676"/>

    <!-- Age labels -->
    <text x="114" y="252" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#00e676" opacity="0.75">20</text>
    <text x="272" y="77"  font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#00e676" opacity="0.95">65</text>
  </g>
</svg>
