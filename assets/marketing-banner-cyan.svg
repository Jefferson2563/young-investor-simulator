<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" fill="none">
  <defs>
    <linearGradient id="bnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020608"/>
      <stop offset="100%" stop-color="#0a1820"/>
    </linearGradient>
    <linearGradient id="bnTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe9ff"/>
    </linearGradient>
    <linearGradient id="bnAcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <linearGradient id="bnLogoBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0a1820"/>
      <stop offset="100%" stop-color="#020608"/>
    </linearGradient>
    <linearGradient id="bnLogoBd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="40%" stop-color="#00d9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#003a55"/>
    </linearGradient>
    <linearGradient id="bnLogoTx" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#b8feff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <radialGradient id="bnHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00d9ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bnBgGlow" cx="0.7" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bnGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bnBg)"/>
  <rect width="1500" height="500" fill="url(#bnBgGlow)"/>

  <!-- Decorative chart line on right side -->
  <g opacity="0.18">
    <path d="M 800 380 Q 900 360 1000 320 Q 1100 280 1200 220 Q 1300 160 1400 90" stroke="#00d9ff" stroke-width="2" fill="none"/>
    <path d="M 800 380 Q 900 360 1000 320 Q 1100 280 1200 220 Q 1300 160 1400 90 L 1400 500 L 800 500 Z" fill="#00d9ff" opacity="0.05"/>
  </g>

  <!-- Logo -->
  <g transform="translate(80 165)">
    <circle cx="85" cy="85" r="78" fill="url(#bnHalo)"/>
    <rect x="35" y="35" width="100" height="100" rx="20" fill="url(#bnLogoBg)"/>
    <rect x="36" y="36" width="98" height="98" rx="19" fill="none" stroke="url(#bnLogoBd)" stroke-width="1.5"/>
    <path d="M61 63 L85 90 L109 63 M85 90 L85 116" stroke="url(#bnLogoTx)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#bnGlow)"/>
    <circle cx="118" cy="56" r="4" fill="#7df9ff" filter="url(#bnGlow)"/>
    <circle cx="117" cy="55" r="1.3" fill="white" opacity="0.7"/>
  </g>

  <!-- Text -->
  <g transform="translate(260 0)">
    <text x="0" y="200" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="600" fill="#7df9ff" letter-spacing="3">YOUNG INVESTOR</text>
    <text x="0" y="290" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="800" fill="url(#bnTxt)">The compound interest tool</text>
    <text x="0" y="365" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="800" fill="url(#bnAcc)">built for Gen Z &amp; millennials.</text>
    <text x="0" y="425" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="500" fill="#9ab" opacity="0.9">younginvestor.app · Free · 7 languages · No signup</text>
  </g>
</svg>
