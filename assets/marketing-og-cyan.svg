<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020608"/>
      <stop offset="100%" stop-color="#0a1820"/>
    </linearGradient>
    <linearGradient id="ogTxt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe9ff"/>
    </linearGradient>
    <linearGradient id="ogAcc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <linearGradient id="ogLogoBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0a1820"/>
      <stop offset="100%" stop-color="#020608"/>
    </linearGradient>
    <linearGradient id="ogLogoBd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="40%" stop-color="#00d9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#003a55"/>
    </linearGradient>
    <linearGradient id="ogLogoTx" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#b8feff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <radialGradient id="ogHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#00d9ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ogBgGlow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ogGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogBgGlow)"/>

  <!-- Subtle grid lines -->
  <g stroke="#00d9ff" stroke-width="0.5" opacity="0.06">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Logo on left -->
  <g transform="translate(60 215)">
    <circle cx="100" cy="100" r="92" fill="url(#ogHalo)"/>
    <rect x="42" y="42" width="116" height="116" rx="24" fill="url(#ogLogoBg)"/>
    <rect x="43" y="43" width="114" height="114" rx="23" fill="none" stroke="url(#ogLogoBd)" stroke-width="1.8"/>
    <path d="M71 73 L100 105 L129 73 M100 105 L100 134" stroke="url(#ogLogoTx)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#ogGlow)"/>
    <circle cx="138" cy="65" r="5" fill="#7df9ff" filter="url(#ogGlow)"/>
    <circle cx="137" cy="64" r="1.6" fill="white" opacity="0.7"/>
  </g>

  <!-- Text block -->
  <g transform="translate(310 0)">
    <text x="0" y="225" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="38" font-weight="600" fill="#7df9ff" letter-spacing="3">YOUNG INVESTOR</text>
    <text x="0" y="320" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="url(#ogTxt)">Investing.</text>
    <text x="0" y="400" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="76" font-weight="800" fill="url(#ogAcc)">Starting at 20.</text>
    <text x="0" y="455" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="500" fill="#9ab" opacity="0.9">Free simulator. Real numbers. No jargon.</text>
  </g>

  <!-- URL footer -->
  <text x="60" y="585" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#7df9ff">younginvestor.app</text>
  <text x="1140" y="585" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500" fill="#778" text-anchor="end">7 languages · No signup</text>
</svg>
