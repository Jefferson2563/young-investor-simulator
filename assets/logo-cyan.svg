<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Young Investor">
  <defs>
    <linearGradient id="cyBgS" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0a1820"/>
      <stop offset="100%" stop-color="#020608"/>
    </linearGradient>
    <linearGradient id="cyBdS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="40%" stop-color="#00d9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#003a55"/>
    </linearGradient>
    <linearGradient id="cyTxS" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#b8feff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <linearGradient id="cyShS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyHaloS" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00d9ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyGlowS" x="-50%" y="-50%" width="200%" height="200%">
