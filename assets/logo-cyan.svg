  <rect x="45" y="45" width="110" height="110" rx="22" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#cySoftS)" opacity="0.55"/>
  <rect x="45" y="45" width="110" height="55" rx="22" fill="url(#cyShS)"/>
  <path d="M73 75 L100 105 L127 75 M100 105 L100 132" stroke="url(#cyTxS)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyGlowS)"/>
  <circle cx="135" cy="68" r="4.6" fill="#7df9ff" filter="url(#cyGlowS)"/>
