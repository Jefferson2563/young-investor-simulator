<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Young Investor">
  <defs>
    <linearGradient id="cyBg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0a1820"/>
      <stop offset="100%" stop-color="#020608"/>
    </linearGradient>
    <linearGradient id="cyBd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="40%" stop-color="#00d9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#003a55"/>
    </linearGradient>
    <linearGradient id="cyTx" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#b8feff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <linearGradient id="cySh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cyHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d9ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#00d9ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cySoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer breathing halo -->
  <circle cx="100" cy="100" r="80" fill="url(#cyHalo)">
    <animate attributeName="r" values="70;88;70" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.5;1"/>
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.5;1"/>
  </circle>

  <!-- Main rounded square -->
  <rect x="45" y="45" width="110" height="110" rx="22" fill="url(#cyBg)"/>

  <!-- Inner border -->
  <rect x="46" y="46" width="108" height="108" rx="21" fill="none" stroke="url(#cyBd)" stroke-width="1.6"/>

  <!-- Outer animated glow stroke -->
  <rect x="45" y="45" width="110" height="110" rx="22" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#cySoftGlow)" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.5;1"/>
    <animate attributeName="stroke-width" values="1.5;3;1.5" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.5;1"/>
  </rect>

  <!-- Top sheen -->
  <rect x="45" y="45" width="110" height="55" rx="22" fill="url(#cySh)"/>

  <!-- Y letter -->
  <path d="M73 75 L100 105 L127 75 M100 105 L100 132" stroke="url(#cyTx)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyGlow)"/>

  <!-- Dot top-right of Y -->
  <circle cx="135" cy="68" r="4.6" fill="#7df9ff" filter="url(#cyGlow)">
    <animate attributeName="r" values="4.2;5.4;4.2" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.5;1"/>
    <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="134" cy="67" r="1.5" fill="white" opacity="0.7"/>
</svg>
